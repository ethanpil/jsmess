<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSMess - Code Playground</title>
  <meta name="description" content="JSMess is an open source HTML/CSS/JavaScript code playground. Write, test, and share web code instantly.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="img/code-scan-svgrepo-com.svg">

  <!-- Styles -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/console.css">

  <!-- Import Map - only non-CodeMirror deps (CM handled by js/cm.js wrapper) -->
  <script type="importmap">
  {
    "imports": {
      "split.js": "https://esm.sh/split.js@1.6.5",
      "lz-string": "https://esm.sh/lz-string@1.5.0"
    }
  }
  </script>

  <!-- App entry point -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <header class="toolbar">
      <div class="toolbar-brand">
        <img src="img/code-scan-svgrepo-com.svg" alt="JSMess" width="24" height="24">
        <span>JSMess</span>
      </div>

      <div class="toolbar-actions">
        <button id="btn-run" class="toolbar-btn primary" title="Run (Ctrl+Enter)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          <span class="label-text">Run</span>
        </button>

        <button id="btn-format" class="toolbar-btn" title="Format (Ctrl+Shift+F)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10H7M21 6H3M21 14H3M21 18H7"/></svg>
          <span class="label-text">Tidy</span>
        </button>

        <div class="toolbar-separator"></div>

        <button id="btn-save" class="toolbar-btn" title="Save (Ctrl+S)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>
          <span class="label-text">Save</span>
        </button>

        <button id="btn-fork" class="toolbar-btn" title="Fork">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v1a2 2 0 01-2 2H8a2 2 0 01-2-2V9"/><line x1="12" y1="12" x2="12" y2="15"/></svg>
          <span class="label-text">Fork</span>
        </button>

        <button id="btn-share" class="toolbar-btn" title="Share link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          <span class="label-text">Share</span>
        </button>
      </div>

      <div class="toolbar-spacer"></div>

      <div class="toolbar-right">
        <button id="btn-messes" class="toolbar-btn" title="My Messes">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
          <span class="label-text">My Messes</span>
        </button>

        <button id="btn-export" class="toolbar-btn" title="Export as file">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span class="label-text">Export</span>
        </button>

        <button id="btn-import" class="toolbar-btn" title="Import file">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="label-text">Import</span>
        </button>

        <div class="toolbar-separator"></div>

        <button id="btn-settings" class="toolbar-btn" title="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>

        <button id="btn-theme" class="toolbar-btn" title="Toggle theme">
          <span class="theme-icon">&#9789;</span>
        </button>
      </div>
    </header>

    <!-- Editor Area - Split.js manages layout -->
    <main class="editor-area">
      <!-- Top Row: HTML + CSS -->
      <div id="top-row" class="split-row">
        <div class="editor-panel" id="html-panel">
          <div class="panel-header">
            <span class="label"><span class="panel-icon html">&#60;/&#62;</span> HTML</span>
          </div>
          <div class="panel-body"></div>
        </div>
        <div class="editor-panel" id="css-panel">
          <div class="panel-header">
            <span class="label"><span class="panel-icon css">{ }</span> CSS</span>
          </div>
          <div class="panel-body"></div>
        </div>
      </div>

      <!-- Bottom Row: JS + Result -->
      <div id="bottom-row" class="split-row">
        <div class="editor-panel" id="js-panel">
          <div class="panel-header">
            <span class="label"><span class="panel-icon js">JS</span> JavaScript</span>
          </div>
          <div class="panel-body"></div>
        </div>
        <div class="result-panel" id="result-panel">
          <div class="result-tabs">
            <button id="tab-preview" class="result-tab active">Result</button>
            <button id="tab-console" class="result-tab">Console <span id="console-count"></span></button>
          </div>
          <div class="result-content">
            <div id="preview-view" class="result-view">
              <iframe id="preview-frame" sandbox="allow-forms allow-popups allow-scripts allow-modals" title="Preview"></iframe>
            </div>
            <div id="console-view" class="result-view hidden">
              <div class="console-toolbar">
                <span style="font-size:11px;color:var(--console-text);">Console</span>
                <button id="btn-clear-console" class="console-clear-btn">Clear</button>
              </div>
              <div id="console-output" class="console-output">
                <div class="console-empty">Console output will appear here...</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Drawer -->
  <div id="settings-overlay" class="settings-overlay"></div>
  <aside id="settings-drawer" class="settings-drawer">
    <div class="settings-section">
      <h3>Layout</h3>
      <div class="settings-row">
        <label>Layout</label>
        <select id="layout-mode">
          <option value="classic">Classic (2x2)</option>
          <option value="left">Editors Left</option>
          <option value="columns">Columns</option>
        </select>
      </div>
    </div>

    <div class="settings-section">
      <h3>Script Loading</h3>
      <div class="settings-row">
        <label>Wrap mode</label>
        <select id="wrap-mode">
          <option value="onLoad">onLoad</option>
          <option value="onDomReady">onDomReady</option>
          <option value="noWrapHead">No wrap - in head</option>
          <option value="noWrapBody">No wrap - in body</option>
        </select>
      </div>
    </div>

    <div class="settings-section">
      <h3>External Libraries</h3>
      <div class="library-search">
        <input type="text" id="library-search-input" placeholder="Search packages...">
        <div id="library-search-results" class="library-search-results"></div>
      </div>
      <div id="library-tags" class="library-tags"></div>
    </div>

    <div class="settings-section">
      <h3>About</h3>
      <p style="font-size:12px;color:var(--text-secondary);line-height:1.6;">
        JSMess is an open source (MIT License) code playground.
        <a href="https://github.com/ethanpil/jsmess">Fork on GitHub</a>.
      </p>
      <p style="margin-top:8px;">
        <a href="https://github.com/ethanpil/jsmess" title="GitHub">
          <img src="img/github-mark.svg" width="24" height="24" alt="GitHub" style="opacity:0.6;">
        </a>
      </p>
    </div>
  </aside>

  <!-- My Messes Modal -->
  <div id="messes-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <span>My Messes</span>
        <button id="messes-modal-close" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="messes-list" class="mess-list"></div>
      </div>
    </div>
  </div>
</body>
</html>
